# Carolina Code Conference Fly org: carolina-code-conference
# Public hostname: carolina-codes-jruby.fly.dev

app = "carolina-codes-jruby"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  RACK_ENV = "production"
  CAROLINA_URL = "http://carolina-codes.internal:8080"
  PUBLIC_BASE_URL = "https://carolina-codes-jruby.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # CMS polyglot timeout is 200ms; CRaC restore is ~40s. Stay up so JRuby can serve.
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "3m"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
