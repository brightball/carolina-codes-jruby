# Local pre-commit hooks. Emergency escape: SKIP=tests,sast,audit,gitleaks,style git commit
# Install once: make hooks   (or: pre-commit install)
repos:
  - repo: local
    hooks:
      - id: tests
        name: handler tests
        language: system
        entry: make test
        pass_filenames: false
        always_run: true
      - id: sast
        name: static security scanner
        language: system
        entry: make sast
        pass_filenames: false
        always_run: true
      - id: audit
        name: 3rd-party dependency scanner
        language: system
        entry: make audit
        pass_filenames: false
        always_run: true
      - id: gitleaks
        name: gitleaks
        language: system
        entry: make gitleaks
        pass_filenames: false
        always_run: true
      - id: style
        name: rubocop
        language: system
        entry: make style
        pass_filenames: false
        always_run: true
